[package]
name = "forge"
version = "0.1.0"          # 版番号ファイル（台帳 ruria-versions-registry と照合する正本）
edition = "2024"
license = "MIT"
publish = false
description = "GitHub-compatible git forge (git smart HTTP, REST v3, GraphQL, MCP) as one static binary"

# 外部クレートは使わない（std のみ）。理由は docs/DECISIONS.md。ここに依存を書かないこと。
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
# panic は unwind のまま: 1接続のスレッドが panic してもプロセスは落とさない。
